openapi: 3.0.3
info:
  title: Event registration API - accounts, login, events and registration
  version: 0.3.0
  description: |
    Hand-written description of the seven auth routes (milestone M1, docs/specs/auth.md):
    signup, login and logout for each role, and GET /auth/me for either role. All bodies are JSON. Errors use the body { "error": "<code>" }; the status is
    fixed by the spec, the codes may be refined.

    The four event routes (milestone M2, docs/specs/events.md): an organizer creates,
    lists and reads their own events; anyone reads the public event page. The event
    `status` is derived at read time with the server clock: `cancelled` if the event
    was cancelled, else `passed` once `starts_at + duration_minutes` is reached, else
    `active`. Seat counts are a snapshot (no lock). Until registration exists (M3),
    `registered` is 0 and `seats_left` equals `capacity`.

    The two registration routes (milestone M3, docs/specs/registration.md): a
    logged-in attendee registers for an event and reads their own registration.
    Registering runs in one transaction that locks the event row, so seats are never
    over-sold: when the `registered` count has reached `capacity`, the new
    registration is `waitlisted`. A seat writes one `ticket` row to the outbox table
    (stored only; nothing is sent yet). Cancelling and promotion are not built yet (M4).

    Login is one signed cookie named `session` (cookie-parser), valid 7 days,
    httpOnly, sameSite=lax, secure only when NODE_ENV=production. Its signed value is
    `<role>.<id>.<expiresAtMs>`; the server checks the expiry itself. Logout only
    clears the cookie in the browser: a copy stays valid until it expires (no
    sessions table). sameSite=lax is the only CSRF defence.
servers:
  - url: http://localhost:3000
tags:
  - name: attendees
    description: Routes under /auth/users (role `user`).
  - name: organizers
    description: Routes under /auth/organizers (role `organizer`).
  - name: session
    description: Routes for either role.
  - name: events
    description: The logged-in organizer's own events (requireOrganizer).
  - name: public
    description: Routes that need no login.
  - name: registrations
    description: The logged-in attendee's own registrations (requireUser).

paths:
  /auth/users/signup:
    post:
      tags: [attendees]
      operationId: signupUser
      summary: Create an attendee account and log in
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Signup"
      responses:
        "201":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "409":
          $ref: "#/components/responses/EmailTaken"
  /auth/users/login:
    post:
      tags: [attendees]
      operationId: loginUser
      summary: Log in as an attendee
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
  /auth/users/logout:
    post:
      tags: [attendees]
      operationId: logoutUser
      summary: Clear the login cookie
      description: Answers 204 also when nobody is logged in.
      security: []
      responses:
        "204":
          $ref: "#/components/responses/LoggedOut"

  /auth/organizers/signup:
    post:
      tags: [organizers]
      operationId: signupOrganizer
      summary: Create an organizer account and log in
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Signup"
      responses:
        "201":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "409":
          $ref: "#/components/responses/EmailTaken"
  /auth/organizers/login:
    post:
      tags: [organizers]
      operationId: loginOrganizer
      summary: Log in as an organizer
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
  /auth/organizers/logout:
    post:
      tags: [organizers]
      operationId: logoutOrganizer
      summary: Clear the login cookie
      description: Answers 204 also when nobody is logged in.
      security: []
      responses:
        "204":
          $ref: "#/components/responses/LoggedOut"

  /auth/me:
    get:
      tags: [session]
      operationId: me
      summary: The logged-in account of either role
      description: |
        The role comes from the cookie and the row is loaded from the matching table
        (users or organizers). Never answers 403 and never sets a cookie.
      security:
        - session: []
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /events:
    post:
      tags: [events]
      operationId: createEvent
      summary: Create an event owned by the logged-in organizer
      description: |
        The owner is the organizer in the cookie, never a body field. Extra fields
        (`organizer_id`, `status`, ...) are ignored. A new event has stored status
        `active` and `schedule_version` 1. The guard runs before the body check, so an
        attendee with a bad body gets 403 and no login gets 401 (a body that is not
        JSON at all is refused with 400 by the JSON parser before any route runs).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEvent"
      responses:
        "201":
          description: The created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEvent"
        "400":
          $ref: "#/components/responses/InvalidEvent"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
    get:
      tags: [events]
      operationId: listEvents
      summary: All events of the logged-in organizer
      description: |
        Only the caller's events, past and cancelled too, ordered by `starts_at`, then
        `id`. No pagination. An organizer with no events gets `{ "events": [] }`.
      security:
        - session: []
      responses:
        "200":
          description: The caller's events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                additionalProperties: false
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizerEvent"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"

  /events/{id}:
    get:
      tags: [events]
      operationId: getEvent
      summary: One event of the logged-in organizer
      description: |
        Another organizer's event, an unknown id and an id that is not a uuid all
        answer the same 404, so ids are not confirmed to strangers. A malformed id is
        answered before any database query.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEvent"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/events/{id}:
    get:
      tags: [public]
      operationId: getPublicEvent
      summary: The public event page
      description: |
        No login; the cookie is ignored, so every caller gets the same answer. Passed
        and cancelled events answer 200 too. Nothing about who is registered is shown.
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{id}/registrations:
    post:
      tags: [registrations]
      operationId: register
      summary: Register the logged-in attendee for an event
      description: |
        The attendee is the account in the cookie; the body is ignored. One
        transaction locks the event row (`FOR UPDATE`), checks that the event is
        open, then: an active registration of this account (`registered` or
        `waitlisted`) is answered with 200 and nothing is written; otherwise a new
        row is stored as `registered` while the `registered` count is below
        `capacity`, else as `waitlisted`, and answered with 201. A new `registered`
        row also writes one `ticket` outbox row (subject and body name the event
        title and the ticket code); a `waitlisted` row writes none. The row and the
        outbox row are stored together or not at all. A started event that has not
        ended still accepts registrations. A cancelled registration does not block a
        new one. The guard runs first, so a malformed id from an anonymous caller is
        401; a malformed id is answered 404 before any database query.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "201":
          description: A new registration, `registered` or `waitlisted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "200":
          description: Already registered or on the waiting list; the same registration (same id and ticket code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/AttendeeOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EventClosed"

  /events/{id}/registrations/me:
    get:
      tags: [registrations]
      operationId: myRegistration
      summary: The logged-in attendee's registration for an event
      description: |
        The caller's own row in whatever status it has, also for a cancelled or
        passed event. An active row (`registered` or `waitlisted`) wins; otherwise
        the newest `cancelled` row is answered. `waitlist_position` is counted at
        read time (a snapshot, no lock). Another attendee's registration is never
        shown.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The caller's registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/AttendeeOnly"
        "404":
          $ref: "#/components/responses/NoRegistration"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: |
        Signed cookie set by signup and login. Value `<role>.<id>.<expiresAtMs>`,
        signed with COOKIE_SECRET. A changed cookie, one signed with another secret,
        or one past its 7 days counts as no login.

  headers:
    SetSessionCookie:
      description: |
        `session=s%3A<role>.<id>.<expiresAtMs>.<signature>; Max-Age=604800; Path=/;
        Expires=<7 days>; HttpOnly; SameSite=Lax` (plus `Secure` when NODE_ENV=production).
        Logging in as the other role replaces the cookie.
      schema:
        type: string
    ClearSessionCookie:
      description: "`session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax`"
      schema:
        type: string

  schemas:
    Account:
      type: object
      required: [role, id, email, name]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, organizer]
          description: The cookie role, not the path word (`user` for /auth/users).
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Stored trimmed and lowercased.
        name:
          type: string
    SignupBody:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          description: |
            Trimmed and lowercased before the check. Then: one `@`, text on both sides,
            no spaces, at most 254 characters. A format check only; nothing is sent.
          example: ann@mail.com
        name:
          type: string
          description: Trimmed, then 1 to 100 characters.
          example: Ann
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Not trimmed. Stored only as an scrypt hash with a random salt.
          format: password
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Trimmed and lowercased before the lookup.
        password:
          type: string
          format: password
    NewEvent:
      type: object
      required: [title, starts_at, duration_minutes, capacity]
      properties:
        title:
          type: string
          description: Trimmed, then 1 to 200 characters (code points), no NUL.
          example: Spring meetup
        starts_at:
          type: string
          format: date-time
          description: |
            ISO 8601 with a date, a time (seconds and up to three fraction digits are
            optional) and `Z` or an offset like `+02:00`. A time without an offset is
            refused. Must be after the server clock at the time of the request.
          example: "2030-01-01T10:00:00Z"
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 90
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
          example: 25
    EventStatus:
      type: string
      enum: [active, cancelled, passed]
      description: |
        Derived at read time: `cancelled` if the event was cancelled; else `passed`
        from `ends_at` on (at exactly `ends_at` it is passed); else `active`.
    OrganizerEvent:
      type: object
      required:
        - id
        - title
        - starts_at
        - ends_at
        - duration_minutes
        - capacity
        - registered
        - seats_left
        - status
        - schedule_version
        - cancelled_at
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
          description: UTC, from toISOString(), for example `2030-01-01T10:00:00.000Z`.
        ends_at:
          type: string
          format: date-time
          description: "`starts_at` plus `duration_minutes`, UTC."
        duration_minutes:
          type: integer
        capacity:
          type: integer
        registered:
          type: integer
          description: The number of `registered` registrations (waiting and cancelled ones do not count). 0 until M3.
        seats_left:
          type: integer
          description: "`capacity - registered`, never below 0. Real numbers for every status."
        status:
          $ref: "#/components/schemas/EventStatus"
        schedule_version:
          type: integer
          description: 1 until reschedule exists (M7).
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    PublicEvent:
      type: object
      required: [id, title, starts_at, ends_at, duration_minutes, capacity, status, has_started, seats_left, full]
      additionalProperties: false
      description: |
        Exactly these keys. No organizer, no registrations, no counts beyond
        `capacity` and `seats_left`.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        capacity:
          type: integer
        status:
          $ref: "#/components/schemas/EventStatus"
        has_started:
          type: boolean
          description: "`starts_at <= now` on the server clock; true while the event runs and after it."
        seats_left:
          type: integer
          description: "`capacity` minus the registered count, never below 0; 0 when `status` is `cancelled` or `passed`."
        full:
          type: boolean
          description: True when `seats_left` is 0 and `status` is `active` (a closed event is not full).
    Registration:
      type: object
      required: [id, event_id, status, ticket_code, waitlist_position, checked_in_at, created_at]
      additionalProperties: false
      description: |
        Exactly these keys. No user id, queue number, email, name or other
        person's data.
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [registered, waitlisted, cancelled]
          description: "`cancelled` is answered only by GET .../registrations/me."
        ticket_code:
          type: string
          pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{10}$"
          description: 10 characters from A-Z without I and O, and 2-9. Also given to waiting people.
          example: K7QM2XWP9D
        waitlist_position:
          type: integer
          minimum: 1
          nullable: true
          description: |
            1-based place on the waiting list (waiting rows of the event that came
            before it, plus itself); `null` unless `status` is `waitlisted`.
        checked_in_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_input

  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: The event id. A value that is not a uuid answers 404.
      schema:
        type: string

  requestBodies:
    Signup:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignupBody"
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginBody"

  responses:
    Account:
      description: The account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    AccountWithCookie:
      description: The account; the login cookie is set (201 on signup, 200 on login).
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetSessionCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    LoggedOut:
      description: The cookie is cleared. No body.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/ClearSessionCookie"
    InvalidInput:
      description: |
        Bad body: bad JSON, not an object, or a field missing or not a string. On signup
        also an invalid email, an empty or too long name, or a password outside 8-128
        characters. Nothing is created and no cookie is set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_input
    InvalidCredentials:
      description: Unknown email or wrong password; both give the same answer and no cookie.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_credentials
    EmailTaken:
      description: The email (after trimming and lowercasing) already has an account of this role. Nothing is created.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: email_taken
    NotLoggedIn:
      description: No cookie, or a changed, foreign-signed or expired one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_logged_in
    WrongRole:
      description: Logged in, but as an attendee. No handler runs and nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: wrong_role
    NotFound:
      description: Unknown id, an id that is not a uuid, or (on the organizer route) another organizer's event. All give the same body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    AttendeeOnly:
      description: Logged in, but as an organizer. No handler runs and nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: wrong_role
    EventClosed:
      description: |
        The event does not take registrations. `event_cancelled`: the event was
        cancelled (wins over passed). `event_passed`: `starts_at + duration_minutes`
        is reached. Checked under the event lock, before the existing registration,
        so a repeat request on a closed event also gets 409. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            cancelled:
              value:
                error: event_cancelled
            passed:
              value:
                error: event_passed
    NoRegistration:
      description: |
        Unknown event, an id that is not a uuid, or the caller never registered for
        this event (no row in any status). All give the same body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    InvalidEvent:
      description: |
        Bad body: not an object; a field missing or of the wrong type; a title empty
        after trimming or over 200 characters; `starts_at` not an ISO 8601 timestamp
        with `Z` or an offset, or not in the future; `capacity` not an integer from 1
        to 100000; `duration_minutes` not an integer from 1 to 1440. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_input
