openapi: 3.0.3
info:
  title: Event registration API - accounts, login, events, registration, check-in and emails
  version: 0.8.0
  description: |
    Hand-written description of the seven auth routes (milestone M1, docs/specs/auth.md):
    signup, login and logout for each role, and GET /auth/me for either role. All bodies are JSON. Errors use the body { "error": "<code>" }; the status is
    fixed by the spec, the codes may be refined.

    The four event routes (milestone M2, docs/specs/events.md): an organizer creates,
    lists and reads their own events; anyone reads the public event page. The event
    `status` is derived at read time with the server clock: `cancelled` if the event
    was cancelled, else `passed` once `starts_at + duration_minutes` is reached, else
    `active`. Seat counts are a snapshot (no lock). Until registration exists (M3),
    `registered` is 0 and `seats_left` equals `capacity`.

    An event has an optional plain-text `description` (docs/specs/event-description.md):
    sent on create, answered in both event shapes, `""` when there is none.

    The public list (docs/specs/events-public-list.md): `GET /public/events` lists
    the events that are not cancelled and not ended, soonest first, at most 100,
    without `description`.

    The two registration routes (milestone M3, docs/specs/registration.md): a
    logged-in attendee registers for an event and reads their own registration.
    Registering runs in one transaction that locks the event row, so seats are never
    over-sold: when the `registered` count has reached `capacity`, the new
    registration is `waitlisted`. A seat writes one `ticket` row to the outbox table
    (sent through Resend by the outbox sender, docs/specs/email-reminders.md). Cancelling and promotion are not built yet (M4).

    My registrations (docs/specs/my-registrations.md): `GET /me/registrations` lists
    all of the logged-in attendee's own registrations in every status, newest first,
    each with the event's title, start and derived status, read in one statement.

    Check-in and the organizer registrations list (milestone M5, docs/specs/checkin.md):
    `POST /checkin` checks a ticket in at the door, once (one conditional UPDATE, so
    of many parallel calls with one code exactly one succeeds).
    `GET /events/{id}/registrations` lists the `registered` and `waitlisted` rows of
    the organizer's own event with the attendee's name and email.

    The arrivals counter (docs/specs/arrivals.md): `GET /events/{id}/arrivals`
    answers `{ capacity, registered, arrived }` for the organizer's own event, read
    in one statement (polled; no live updates yet).

    The emails of an event (docs/specs/email-outbox.md): `GET /events/{id}/emails`
    lists the outbox rows of the organizer's own event with their delivery status,
    newest first, at most 200, optionally of one kind, one status or one
    registration. Never the body (it holds the ticket code).

    Login is one signed cookie named `session` (cookie-parser), valid 7 days,
    httpOnly, sameSite=lax, secure only when NODE_ENV=production. Its signed value is
    `<role>.<id>.<expiresAtMs>`; the server checks the expiry itself. Logout only
    clears the cookie in the browser: a copy stays valid until it expires (no
    sessions table). sameSite=lax is the only CSRF defence.
servers:
  - url: http://localhost:3000
tags:
  - name: attendees
    description: Routes under /auth/users (role `user`).
  - name: organizers
    description: Routes under /auth/organizers (role `organizer`).
  - name: session
    description: Routes for either role.
  - name: events
    description: The logged-in organizer's own events (requireOrganizer).
  - name: public
    description: Routes that need no login.
  - name: registrations
    description: Registering, the attendee's own registration and the list of all their own registrations (requireUser), and the registrations list of an organizer's own event (requireOrganizer).
  - name: checkin
    description: Checking a ticket in at the door and the arrivals counts, for the logged-in organizer's own events (requireOrganizer).
  - name: email
    description: The emails (outbox rows) of the logged-in organizer's own events (requireOrganizer). Read only.

paths:
  /auth/users/signup:
    post:
      tags: [attendees]
      operationId: signupUser
      summary: Create an attendee account and log in
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Signup"
      responses:
        "201":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "409":
          $ref: "#/components/responses/EmailTaken"
  /auth/users/login:
    post:
      tags: [attendees]
      operationId: loginUser
      summary: Log in as an attendee
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
  /auth/users/logout:
    post:
      tags: [attendees]
      operationId: logoutUser
      summary: Clear the login cookie
      description: Answers 204 also when nobody is logged in.
      security: []
      responses:
        "204":
          $ref: "#/components/responses/LoggedOut"

  /auth/organizers/signup:
    post:
      tags: [organizers]
      operationId: signupOrganizer
      summary: Create an organizer account and log in
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Signup"
      responses:
        "201":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "409":
          $ref: "#/components/responses/EmailTaken"
  /auth/organizers/login:
    post:
      tags: [organizers]
      operationId: loginOrganizer
      summary: Log in as an organizer
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/AccountWithCookie"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
  /auth/organizers/logout:
    post:
      tags: [organizers]
      operationId: logoutOrganizer
      summary: Clear the login cookie
      description: Answers 204 also when nobody is logged in.
      security: []
      responses:
        "204":
          $ref: "#/components/responses/LoggedOut"

  /auth/me:
    get:
      tags: [session]
      operationId: me
      summary: The logged-in account of either role
      description: |
        The role comes from the cookie and the row is loaded from the matching table
        (users or organizers). Never answers 403 and never sets a cookie.
      security:
        - session: []
      responses:
        "200":
          $ref: "#/components/responses/Account"
        "401":
          $ref: "#/components/responses/NotLoggedIn"

  /events:
    post:
      tags: [events]
      operationId: createEvent
      summary: Create an event owned by the logged-in organizer
      description: |
        The owner is the organizer in the cookie, never a body field. Extra fields
        (`organizer_id`, `status`, ...) are ignored. A new event has stored status
        `active` and `schedule_version` 1. The guard runs before the body check, so an
        attendee with a bad body gets 403 and no login gets 401 (a body that is not
        JSON at all is refused with 400 by the JSON parser before any route runs).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEvent"
      responses:
        "201":
          description: The created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEvent"
        "400":
          $ref: "#/components/responses/InvalidEvent"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
    get:
      tags: [events]
      operationId: listEvents
      summary: All events of the logged-in organizer
      description: |
        Only the caller's events, past and cancelled too, ordered by `starts_at`, then
        `id`. No pagination. An organizer with no events gets `{ "events": [] }`.
      security:
        - session: []
      responses:
        "200":
          description: The caller's events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                additionalProperties: false
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizerEvent"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"

  /events/{id}:
    get:
      tags: [events]
      operationId: getEvent
      summary: One event of the logged-in organizer
      description: |
        Another organizer's event, an unknown id and an id that is not a uuid all
        answer the same 404, so ids are not confirmed to strangers. A malformed id is
        answered before any database query.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEvent"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
        "404":
          $ref: "#/components/responses/NotFound"

  /public/events:
    get:
      tags: [public]
      operationId: listPublicEvents
      summary: The events that can still be joined
      description: |
        No login; the cookie is ignored, so every caller gets the same answer
        (docs/specs/events-public-list.md). Lists only events that are not cancelled
        and not ended (`now < starts_at + duration_minutes` on the server clock, one
        `now` per request): upcoming and running events, full ones too. Ordered by
        `starts_at`, then `id`. At most 100 events, no pagination; any query string
        is ignored. No event qualifies: `{ "events": [] }`. A cancelled or passed
        event is still answered by `GET /public/events/{id}`.
      security: []
      responses:
        "200":
          description: The listed events, possibly none.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                additionalProperties: false
                properties:
                  events:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/PublicListItem"
        "500":
          description: Database failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: internal

  /public/events/{id}:
    get:
      tags: [public]
      operationId: getPublicEvent
      summary: The public event page
      description: |
        No login; the cookie is ignored, so every caller gets the same answer. Passed
        and cancelled events answer 200 too. Nothing about who is registered is shown.
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{id}/registrations:
    post:
      tags: [registrations]
      operationId: register
      summary: Register the logged-in attendee for an event
      description: |
        The attendee is the account in the cookie; the body is ignored. One
        transaction locks the event row (`FOR UPDATE`), checks that the event is
        open, then: an active registration of this account (`registered` or
        `waitlisted`) is answered with 200 and nothing is written; otherwise a new
        row is stored as `registered` while the `registered` count is below
        `capacity`, else as `waitlisted`, and answered with 201. A new `registered`
        row also writes one `ticket` outbox row (subject and body name the event
        title and the ticket code); a `waitlisted` row writes none. The row and the
        outbox row are stored together or not at all. A started event that has not
        ended still accepts registrations. A cancelled registration does not block a
        new one. The guard runs first, so a malformed id from an anonymous caller is
        401; a malformed id is answered 404 before any database query.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "201":
          description: A new registration, `registered` or `waitlisted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "200":
          description: Already registered or on the waiting list; the same registration (same id and ticket code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/AttendeeOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EventClosed"
    get:
      tags: [registrations]
      operationId: listEventRegistrations
      summary: The registrations of one of the logged-in organizer's events
      description: |
        The `registered` and `waitlisted` rows of the event (cancelled rows are left
        out), ordered by `created_at`, then `id` (docs/specs/checkin.md C15-C18).
        The arrivals counter has its own route, `GET /events/{id}/arrivals`
        (docs/specs/arrivals.md); this list stays for the table. A fresh snapshot
        for polling: the rows come from one
        statement, no lock, no paging, `Cache-Control: no-store`. A cancelled or
        passed event still answers 200. The guard runs first, so a malformed id from
        an anonymous caller is 401; a malformed id is answered 404 before any
        database query. Another organizer's event answers the same 404 as an unknown
        one. After a successful `POST /checkin` only that item's `checked_in_at`
        changes; a refused check-in changes nothing.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event's registrations, possibly none.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [registrations]
                additionalProperties: false
                properties:
                  registrations:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizerRegistration"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{id}/registrations/me:
    get:
      tags: [registrations]
      operationId: myRegistration
      summary: The logged-in attendee's registration for an event
      description: |
        The caller's own row in whatever status it has, also for a cancelled or
        passed event. An active row (`registered` or `waitlisted`) wins; otherwise
        the newest `cancelled` row is answered. `waitlist_position` is counted at
        read time (a snapshot, no lock). Another attendee's registration is never
        shown.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The caller's registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/AttendeeOnly"
        "404":
          $ref: "#/components/responses/NoRegistration"

  /me/registrations:
    get:
      tags: [registrations]
      operationId: myRegistrations
      summary: All of the logged-in attendee's own registrations
      description: |
        Every row of the caller (the user id comes from the cookie only; a query
        string or body is ignored), in any status: `registered`, `waitlisted` and
        `cancelled`, also for a cancelled or passed event. After a cancel and a new
        registration for the same event both rows are listed. Ordered by the
        registration's `created_at`, newest first, then `id` descending. Each item
        carries the event's title, start and status (derived at the instant of the
        request: `cancelled` wins, else `passed` from `starts_at + duration_minutes`
        on, else `active`). One statement, no lock, no paging, no cache,
        `Cache-Control: no-store`. The route has no input, so there is no 400 and no
        404; it writes nothing (docs/specs/my-registrations.md MR1-MR15).
      security:
        - session: []
      responses:
        "200":
          description: The caller's registrations, possibly none.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [registrations]
                additionalProperties: false
                properties:
                  registrations:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyRegistration"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/AttendeeOnly"

  /events/{id}/arrivals:
    get:
      tags: [checkin]
      operationId: eventArrivals
      summary: The arrivals counts of one of the logged-in organizer's events
      description: |
        `capacity` is the stored capacity (not reduced by taken seats and not
        clamped, so `registered` can be above it after a capacity change);
        `registered` is the number of `registered` rows (taken seats, the same
        number as `registered` in the organizer event shape); `arrived` is the
        number of those with `checked_in_at` set. Waitlisted and cancelled rows are
        in neither number (docs/specs/arrivals.md AR1-AR15). Both counts come from
        one statement, so `arrived` is never above `registered`; no lock, no
        transaction, no cache, `Cache-Control: no-store` on 200 and 404. After a
        `POST /checkin` answered 200, the next read shows `arrived` one higher; a
        refused or repeated check-in changes nothing. An event with nobody answers
        `0` and `0`; a cancelled or passed event still answers 200. The guard runs
        first, so a malformed id from an anonymous caller is 401; a malformed id is
        answered 404 before any database query. Another organizer's event answers
        the same 404 as an unknown one. The route writes nothing.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The event's arrivals counts.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arrivals"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{id}/emails:
    get:
      tags: [email]
      operationId: eventEmails
      summary: The emails of one of the logged-in organizer's events
      description: |
        The outbox rows of the registrations of this event, in every kind and
        status by default, also of waiting and cancelled registrations
        (docs/specs/email-outbox.md OB1-OB18). Newest first (`created_at`
        descending, then `id`), at most 200 rows after the filters;
        `truncated` is true when more matched. `status` is as stored: `pending`
        (waiting for the sender; `send_attempts` counts failed tries), `sent`
        (the provider accepted it, not that it arrived) or `error_sending` (3
        failed tries, not retried). `to_email` is the address the row was written
        to; `attendee_name` is the person's current name. The body is never
        returned (it holds the ticket code). One statement, no lock, nothing
        written, `Cache-Control: no-store` on 200, 400 and 404. Order of checks:
        the guard (401, 403), the path id (404 without a query), `kind`,
        `status`, then `registration_id` (400), then the ownership (404).
        Another organizer's event answers the same 404 as an unknown one. Other
        query parameters are ignored.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: kind
          in: query
          required: false
          description: Only this kind. Any other value, an empty or a repeated one answers 400 `invalid_kind`.
          schema:
            type: string
            enum: [ticket, promotion, reminder, reschedule, event_cancelled]
        - name: status
          in: query
          required: false
          description: Only this status. Any other value, an empty or a repeated one answers 400 `invalid_status`.
          schema:
            type: string
            enum: [pending, sent, error_sending]
        - name: registration_id
          in: query
          required: false
          description: |
            Only the emails of this registration (one attendee). Empty list if it is
            not a registration of this event (no 404, so the route never says whether
            the id exists elsewhere). A value that is not a uuid, an empty or a
            repeated one answers 400 `invalid_registration_id`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The event's emails.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailList"
        "400":
          description: A bad query value; `error` is `invalid_kind`, `invalid_status` or `invalid_registration_id`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
        "404":
          $ref: "#/components/responses/NotFound"

  /checkin:
    post:
      tags: [checkin]
      operationId: checkIn
      summary: Check a ticket in at the door
      description: |
        The organizer is the account in the cookie, never a body field; other body
        fields are ignored (docs/specs/checkin.md C1-C14, C19). The guard runs
        first, so a bad body from an anonymous caller is 401 (a body that is not JSON
        at all is refused with 400 by the JSON parser before any route runs). The
        code is trimmed and upper-cased, then must be 10 characters of the ticket
        alphabet; anything else is 400 before any database query.

        One conditional UPDATE, no lock, no explicit transaction: it sets
        `checked_in_at = now()` only for a `registered` ticket that is not checked in
        yet, on an event of this organizer whose stored status is `active`. So of
        many parallel calls with one code exactly one answers 200 and the others 409
        `already_checked_in`. There is no time window: a passed event and an event
        that has not started yet both allow check-in. Only `checked_in_at` of that
        one registration changes; no email is written.

        When the UPDATE changes no row, the ticket is read once (joined to this
        organizer's events) and the answer is, in this order: no row 404
        `not_found` (an unknown code and another organizer's ticket give the same
        body); `event_cancelled` (also for a ticket already checked in);
        `registration_cancelled`; `waitlisted`; `already_checked_in` with the
        original time and the name. If the read shows a free ticket (promoted from
        the waiting list in between), the UPDATE runs once more.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInBody"
      responses:
        "200":
          description: Checked in now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "400":
          $ref: "#/components/responses/InvalidTicketCode"
        "401":
          $ref: "#/components/responses/NotLoggedIn"
        "403":
          $ref: "#/components/responses/WrongRole"
        "404":
          $ref: "#/components/responses/UnknownTicket"
        "409":
          $ref: "#/components/responses/CheckInRefused"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: |
        Signed cookie set by signup and login. Value `<role>.<id>.<expiresAtMs>`,
        signed with COOKIE_SECRET. A changed cookie, one signed with another secret,
        or one past its 7 days counts as no login.

  headers:
    SetSessionCookie:
      description: |
        `session=s%3A<role>.<id>.<expiresAtMs>.<signature>; Max-Age=604800; Path=/;
        Expires=<7 days>; HttpOnly; SameSite=Lax` (plus `Secure` when NODE_ENV=production).
        Logging in as the other role replaces the cookie.
      schema:
        type: string
    ClearSessionCookie:
      description: "`session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax`"
      schema:
        type: string

  schemas:
    Account:
      type: object
      required: [role, id, email, name]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, organizer]
          description: The cookie role, not the path word (`user` for /auth/users).
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Stored trimmed and lowercased.
        name:
          type: string
    SignupBody:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          description: |
            Trimmed and lowercased before the check. Then: one `@`, text on both sides,
            no spaces, at most 254 characters. A format check only; nothing is sent.
          example: ann@mail.com
        name:
          type: string
          description: Trimmed, then 1 to 100 characters.
          example: Ann
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Not trimmed. Stored only as an scrypt hash with a random salt.
          format: password
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Trimmed and lowercased before the lookup.
        password:
          type: string
          format: password
    NewEvent:
      type: object
      required: [title, starts_at, duration_minutes, capacity]
      properties:
        title:
          type: string
          description: Trimmed, then 1 to 200 characters (code points), no NUL.
          example: Spring meetup
        description:
          type: string
          nullable: true
          description: |
            Optional plain text, shown to the organizer and on the public page.
            Trimmed (leading and trailing whitespace; inner line breaks are kept),
            then at most 2000 characters (code points), no NUL. Missing, `null`, or
            only whitespace is stored as `""`. Not changed or escaped by the API
            (no HTML handling): clients must show it as text.
          example: "Bring a laptop.\n\nDoors at 9."
        starts_at:
          type: string
          format: date-time
          description: |
            ISO 8601 with a date, a time (seconds and up to three fraction digits are
            optional) and `Z` or an offset like `+02:00`. A time without an offset is
            refused. Must be after the server clock at the time of the request.
          example: "2030-01-01T10:00:00Z"
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 90
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
          example: 25
    EventStatus:
      type: string
      enum: [active, cancelled, passed]
      description: |
        Derived at read time: `cancelled` if the event was cancelled; else `passed`
        from `ends_at` on (at exactly `ends_at` it is passed); else `active`.
    OrganizerEvent:
      type: object
      required:
        - id
        - title
        - description
        - starts_at
        - ends_at
        - duration_minutes
        - capacity
        - registered
        - seats_left
        - status
        - schedule_version
        - cancelled_at
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: The stored plain text, `""` when there is none. Never null.
        starts_at:
          type: string
          format: date-time
          description: UTC, from toISOString(), for example `2030-01-01T10:00:00.000Z`.
        ends_at:
          type: string
          format: date-time
          description: "`starts_at` plus `duration_minutes`, UTC."
        duration_minutes:
          type: integer
        capacity:
          type: integer
        registered:
          type: integer
          description: The number of `registered` registrations (waiting and cancelled ones do not count). 0 until M3.
        seats_left:
          type: integer
          description: "`capacity - registered`, never below 0. Real numbers for every status."
        status:
          $ref: "#/components/schemas/EventStatus"
        schedule_version:
          type: integer
          description: 1 until reschedule exists (M7).
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    PublicEvent:
      type: object
      required: [id, title, description, starts_at, ends_at, duration_minutes, capacity, status, has_started, seats_left, full]
      additionalProperties: false
      description: |
        Exactly these keys. No organizer, no registrations, no counts beyond
        `capacity` and `seats_left`.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: |
            The stored plain text as is, `""` when there is none, for every status
            (also cancelled and passed). Show it as text, never as HTML.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        capacity:
          type: integer
        status:
          $ref: "#/components/schemas/EventStatus"
        has_started:
          type: boolean
          description: "`starts_at <= now` on the server clock; true while the event runs and after it."
        seats_left:
          type: integer
          description: "`capacity` minus the registered count, never below 0; 0 when `status` is `cancelled` or `passed`."
        full:
          type: boolean
          description: True when `seats_left` is 0 and `status` is `active` (a closed event is not full).
    PublicListItem:
      type: object
      required: [id, title, starts_at, ends_at, duration_minutes, capacity, status, has_started, seats_left, full]
      additionalProperties: false
      description: |
        One item of `GET /public/events`: the public event without `description`.
        Exactly these keys. No organizer, no registrations.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
          description: UTC, for example `2030-01-01T10:00:00.000Z`.
        ends_at:
          type: string
          format: date-time
          description: "`starts_at` plus `duration_minutes`, UTC."
        duration_minutes:
          type: integer
        capacity:
          type: integer
        status:
          type: string
          enum: [active]
          description: Always `active` (cancelled and passed events are not listed).
        has_started:
          type: boolean
          description: "`starts_at <= now`; true while the event runs."
        seats_left:
          type: integer
          description: "`capacity` minus the registered count, never below 0."
        full:
          type: boolean
          description: True when `seats_left` is 0. A full event is listed (its waiting list is open).
    Registration:
      type: object
      required: [id, event_id, status, ticket_code, waitlist_position, checked_in_at, created_at]
      additionalProperties: false
      description: |
        Exactly these keys. No user id, queue number, email, name or other
        person's data.
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [registered, waitlisted, cancelled]
          description: "`cancelled` is answered only by GET .../registrations/me and GET /me/registrations."
        ticket_code:
          type: string
          pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{10}$"
          description: 10 characters from A-Z without I and O, and 2-9. Also given to waiting people.
          example: K7QM2XWP9D
        waitlist_position:
          type: integer
          minimum: 1
          nullable: true
          description: |
            1-based place on the waiting list (waiting rows of the event that came
            before it, plus itself); `null` unless `status` is `waitlisted`.
        checked_in_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    OrganizerRegistration:
      type: object
      required:
        [id, event_id, status, ticket_code, waitlist_position, checked_in_at, created_at, attendee_name, attendee_email]
      additionalProperties: false
      description: |
        An item of the organizer registrations list: the keys of `Registration`
        plus the attendee's name and email, shown only to the owning organizer.
        No user id, queue number, `cancelled_at` or password hash.
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [registered, waitlisted]
        ticket_code:
          type: string
          pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{10}$"
          example: K7QM2XWP9D
        waitlist_position:
          type: integer
          minimum: 1
          nullable: true
          description: Counted as in `Registration`; `null` unless `status` is `waitlisted`.
        checked_in_at:
          type: string
          format: date-time
          nullable: true
          description: Set once the ticket is checked in; always `null` for a `waitlisted` item.
        created_at:
          type: string
          format: date-time
        attendee_name:
          type: string
        attendee_email:
          type: string
          format: email
    MyRegistration:
      type: object
      required:
        [id, event_id, status, ticket_code, waitlist_position, checked_in_at, created_at, event_title, event_starts_at, event_status]
      additionalProperties: false
      description: |
        An item of the attendee's own registrations list: the keys of `Registration`
        plus the event's title, start and derived status. Written out instead of
        `allOf` because `Registration` forbids additional properties. No user id,
        queue number, `cancelled_at`, organizer id, capacity, description, email or
        name.
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [registered, waitlisted, cancelled]
        ticket_code:
          type: string
          pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{10}$"
          description: Kept on a cancelled row.
          example: K7QM2XWP9D
        waitlist_position:
          type: integer
          minimum: 1
          nullable: true
          description: Counted as in `Registration`; `null` unless `status` is `waitlisted`.
        checked_in_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        event_title:
          type: string
          description: The event's current title.
        event_starts_at:
          type: string
          format: date-time
          description: The event's current start, in UTC.
        event_status:
          $ref: "#/components/schemas/EventStatus"
    Arrivals:
      type: object
      required: [capacity, registered, arrived]
      additionalProperties: false
      description: |
        Three numbers for the arrivals counter. No event id, title, organizer id or
        any person's data.
      properties:
        capacity:
          type: integer
          minimum: 0
          description: The stored `events.capacity`.
        registered:
          type: integer
          minimum: 0
          description: Rows with `status = 'registered'` (taken seats).
        arrived:
          type: integer
          minimum: 0
          description: Of the `registered` rows, those with `checked_in_at` set; never above `registered`.
      example:
        capacity: 25
        registered: 20
        arrived: 12
    CheckInBody:
      type: object
      required: [ticket_code]
      properties:
        ticket_code:
          type: string
          description: |
            Trimmed and upper-cased, then exactly 10 characters from A-Z without I
            and O, and 2-9 (no spaces inside, look-alike letters are not mapped).
          example: " k7qm2xwp9d "
    CheckIn:
      type: object
      required: [registration_id, ticket_code, event_id, event_title, attendee_name, checked_in_at]
      additionalProperties: false
      description: |
        Exactly these keys. No email, user id, queue number or other person's data.
      properties:
        registration_id:
          type: string
          format: uuid
        ticket_code:
          type: string
          pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{10}$"
          description: The stored (normalised) code.
          example: K7QM2XWP9D
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
          description: The ticket may belong to any of the organizer's own events; the title names it.
        attendee_name:
          type: string
        checked_in_at:
          type: string
          format: date-time
          description: The stored time, UTC, for example `2030-01-01T10:00:00.000Z`.
    AlreadyCheckedIn:
      type: object
      required: [error, checked_in_at, attendee_name]
      additionalProperties: false
      description: The only error body with more keys than `error`.
      properties:
        error:
          type: string
          enum: [already_checked_in]
        checked_in_at:
          type: string
          format: date-time
          description: The first (stored) check-in time, not the time of the repeat.
        attendee_name:
          type: string
    EmailList:
      type: object
      required: [emails, truncated]
      additionalProperties: false
      properties:
        emails:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/EmailItem"
        truncated:
          type: boolean
          description: True when more than 200 rows matched; the newest 200 are listed.
    EmailItem:
      type: object
      required:
        [id, registration_id, kind, status, send_attempts, send_error, to_email, subject, schedule_version, event_starts_at, created_at, sent_at, attendee_name]
      additionalProperties: false
      description: One outbox row. Never the body or the ticket code.
      properties:
        id:
          type: string
          format: uuid
        registration_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [ticket, promotion, reminder, reschedule, event_cancelled]
        status:
          type: string
          enum: [pending, sent, error_sending]
        send_attempts:
          type: integer
          minimum: 0
          description: Failed tries (3 for an `error_sending` row).
        send_error:
          type: string
          nullable: true
          description: The short reason of the last failed try (addresses replaced), or null.
        to_email:
          type: string
          description: The address stored in the row when it was written.
        subject:
          type: string
        schedule_version:
          type: integer
        event_starts_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: Set only when `status` is `sent`.
        attendee_name:
          type: string
          description: The current name of the registration's person.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_input

  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: The event id. A value that is not a uuid answers 404.
      schema:
        type: string

  requestBodies:
    Signup:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignupBody"
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginBody"

  responses:
    Account:
      description: The account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    AccountWithCookie:
      description: The account; the login cookie is set (201 on signup, 200 on login).
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetSessionCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    LoggedOut:
      description: The cookie is cleared. No body.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/ClearSessionCookie"
    InvalidInput:
      description: |
        Bad body: bad JSON, not an object, or a field missing or not a string. On signup
        also an invalid email, an empty or too long name, or a password outside 8-128
        characters. Nothing is created and no cookie is set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_input
    InvalidCredentials:
      description: Unknown email or wrong password; both give the same answer and no cookie.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_credentials
    EmailTaken:
      description: The email (after trimming and lowercasing) already has an account of this role. Nothing is created.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: email_taken
    NotLoggedIn:
      description: No cookie, or a changed, foreign-signed or expired one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_logged_in
    WrongRole:
      description: Logged in, but as an attendee. No handler runs and nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: wrong_role
    NotFound:
      description: Unknown id, an id that is not a uuid, or (on the organizer route) another organizer's event. All give the same body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    AttendeeOnly:
      description: Logged in, but as an organizer. No handler runs and nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: wrong_role
    EventClosed:
      description: |
        The event does not take registrations. `event_cancelled`: the event was
        cancelled (wins over passed). `event_passed`: `starts_at + duration_minutes`
        is reached. Checked under the event lock, before the existing registration,
        so a repeat request on a closed event also gets 409. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            cancelled:
              value:
                error: event_cancelled
            passed:
              value:
                error: event_passed
    NoRegistration:
      description: |
        Unknown event, an id that is not a uuid, or the caller never registered for
        this event (no row in any status). All give the same body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    InvalidTicketCode:
      description: |
        Bad body: not an object, `ticket_code` missing or not a string, or after
        trimming and upper-casing not 10 characters of the ticket alphabet. Answered
        before any database query; nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_input
    UnknownTicket:
      description: |
        No ticket with this code on the organizer's own events: an unknown code and
        a ticket of another organizer's event give the same body. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    CheckInRefused:
      description: |
        The ticket cannot be checked in; nothing is written. Checked in this order:
        `event_cancelled` (the event was cancelled; also for a ticket already checked
        in), `registration_cancelled`, `waitlisted` (no seat yet),
        `already_checked_in` (with the first check-in time and the attendee's name).
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/AlreadyCheckedIn"
              - $ref: "#/components/schemas/Error"
          examples:
            eventCancelled:
              value:
                error: event_cancelled
            registrationCancelled:
              value:
                error: registration_cancelled
            waitlisted:
              value:
                error: waitlisted
            alreadyCheckedIn:
              value:
                error: already_checked_in
                checked_in_at: "2030-01-01T10:02:03.456Z"
                attendee_name: Ann
    InvalidEvent:
      description: |
        Bad body: not an object; a field missing or of the wrong type; a title empty
        after trimming or over 200 characters; `description` not a string or null,
        over 2000 characters after trimming, or containing NUL; `starts_at` not an
        ISO 8601 timestamp with `Z` or an offset, or not in the future; `capacity` not
        an integer from 1 to 100000; `duration_minutes` not an integer from 1 to 1440.
        Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_input
