# Render Blueprint for the API and its database (README: "Deploy on Render").
# Render looks for render.yaml in the repository root by default; this file is
# in api/, so give that path when you create the Blueprint (New > Blueprint >
# Blueprint file path: api/render.yaml). The web is a separate Static Site (see
# the README), it is not part of this file.
databases:
  - name: events-registrations-postresql
    databaseName: events
    plan: free

services:
  - type: web
    name: event-registration-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: events-registrations-postresql
          property: connectionString
      - key: COOKIE_SECRET
        generateValue: true
      # Secrets and per-deploy values: Render asks for them when it creates the Blueprint.
      - key: EMAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # The web origin, for example https://<web>.onrender.com (no trailing slash).
      - key: CORS_ORIGIN
        sync: false
